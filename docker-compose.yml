version: "3.8"

services:

  # --- VPN gateway: TODO el tráfico de qbittorrent pasa por aquí ---
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=${GLUETUN_VPN_SERVICE_PROVIDER}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${GLUETUN_WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${GLUETUN_SERVER_COUNTRIES}
      - HTTPPROXY=on
      - HTTPPROXY_USER=${GLUETUN_HTTPPROXY_USER}
      - HTTPPROXY_PASSWORD=${GLUETUN_HTTPPROXY_PASSWORD}
    ports:
      - 8080:8080     # qBittorrent WebUI (se sirve a través de gluetun)
      - 8888:8888     # Proxy HTTP de gluetun (para Prowlarr/Sonarr/Radarr)
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${FLARESOLVERR_TZ}
    volumes:
      - ~/media-server/qbittorrent:/config
      - /mnt/storage/downloads:/downloads
    depends_on:
      - gluetun
    restart: unless-stopped

  # --- Jellyfin: el "Netflix" que sirve el contenido ---
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    ports:
      - 8096:8096
    volumes:
      - ~/media-server/jellyfin:/config
      - /mnt/storage:/media
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${FLARESOLVERR_TZ}
      - PROXY_URL=http://gluetun:8888
      - PROXY_USERNAME=${FLARESOLVERR_PROXY_USERNAME}
      - PROXY_PASSWORD=${FLARESOLVERR_PROXY_PASSWORD}
    ports:
      - 8191:8191
    restart: unless-stopped
  # --- Prowlarr: gestor central de indexadores (trackers de torrent) ---
  prowlarr:
    image: linuxserver/prowlarr
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${FLARESOLVERR_TZ}
    volumes:
      - ~/media-server/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  # --- Sonarr: busca y descarga automáticamente episodios de series ---
  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${FLARESOLVERR_TZ}
    volumes:
      - ~/media-server/sonarr:/config
      - /mnt/storage:/media
    ports:
      - 8989:8989
    restart: unless-stopped

  # --- Radarr: lo mismo que Sonarr pero para películas ---
  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${FLARESOLVERR_TZ}
    volumes:
      - ~/media-server/radarr:/config
      - /mnt/storage:/media
    ports:
      - 7878:7878
    restart: unless-stopped

  # --- Bazarr: descarga subtítulos automáticamente para Sonarr/Radarr ---
  bazarr:
    image: linuxserver/bazarr
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${FLARESOLVERR_TZ}
    volumes:
      - ~/media-server/bazarr:/config
      - /mnt/storage:/media
    ports:
      - 6767:6767
    restart: unless-stopped

  # --- Jellyseerr: pantalla de "solicitar contenido" estilo Netflix, conectada a Jellyfin ---
  jellyseerr:
    image: fallenbagel/jellyseerr
    container_name: jellyseerr
    environment:
      - TZ=${FLARESOLVERR_TZ}
    volumes:
      - ~/media-server/jellyseerr:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped

  # --- Watchtower: mantiene todas las imágenes actualizadas automáticamente,
  #     incluyendo control-panel cuando el CI/CD publique una nueva versión ---
  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true   # mantiene también el chequeo nocturno normal
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN}
    ports:
      - "8081:8080"   # 8080 ya lo usa gluetun/qbittorrent, por eso 8081 en el host
    restart: unless-stopped

  # --- Panel de control
  control-panel:
    image: ghcr.io/${GITHUB_REPO_USER}/${GITHUB_REPO_NAME}:latest
    container_name: control-panel
    env_file:
      - .env
    environment:
      - CONTROL_PANEL_IMAGE=ghcr.io/${GITHUB_REPO_USER}/${GITHUB_REPO_NAME}:latest
      - WATCHTOWER_HOST=watchtower
      - WATCHTOWER_PORT=8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/storage:/storage:ro       # solo lectura, solo para medir espacio libre
    ports:
      - 4000:4000
    restart: unless-stopped